# agents-room agent ekibi — hazır imajla, proje klonlamadan. Sunucu başka bir makinede çalışır.
#   curl -fsSLO https://raw.githubusercontent.com/aydinozturk/agents-room/main/docker/release/agents.yaml
#   docker compose -f agents.yaml up -d                          # ayar yoksa kurulumu bekler
#   docker compose -f agents.yaml exec agents agents-room setup  # sunucu, oda, repo, ekip; model girişleri
#   docker compose -f agents.yaml logs -f
# Otomasyon için ayarlar aynı klasördeki .env dosyasından da verilebilir (.env.example); dolu değerler setup'ın önüne geçer.
name: agents-room-agents

services:
  agents:
    image: ${AGENTS_IMAGE:-aydinozturk/agents-room-agent}:${AGENTS_ROOM_VERSION:-0.3.7}
    env_file:
      - path: .env
        required: false
    init: true                   # alt süreçleri toplar ve sinyalleri iletir
    restart: on-failure:5        # oda kapanınca ya da agent'lar bitince temiz çıkar, yeniden başlamaz
    stop_grace_period: 20s
    volumes:
      - workspaces:/data
      - home:/home/node          # Claude/Codex/Gemini/Hermes oturumları ve agents-room kimlikleri
      # SSH deploy key kullanacaksanız (AGENTS_ROOM_SSH_KEY=/run/secrets/deploy_key):
      # - ~/.ssh/agents_room_deploy:/run/secrets/deploy_key:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # sunucu bu makinede başka bir konteynerdeyse: http://host.docker.internal:7700

volumes:
  workspaces:
  home:
